<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="db.why() walks from a tool_call back through llm_response to the root-cause user_message">
  <style>
    .bg{fill:#0d1117}
    .term{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8b949e}
    .prompt{fill:#f97316}
    .node rect{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .node .t{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6edf3}
    .node .s{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8b949e}
    .edge{stroke:#f97316;stroke-width:2.5;fill:none;stroke-dasharray:120;stroke-dashoffset:120}
    .n1,.n2,.n3,.cap{opacity:0}
    .n1{animation:show 8s infinite 0.4s}
    .e1{animation:draw 8s infinite 1.2s}
    .n2{animation:show 8s infinite 1.8s}
    .e2{animation:draw 8s infinite 2.6s}
    .n3{animation:show 8s infinite 3.2s}
    .root rect{animation:pulse 8s infinite 3.2s}
    .cap{animation:show 8s infinite 4s;font:600 14px ui-sans-serif,-apple-system,Segoe UI,sans-serif;fill:#f97316}
    @keyframes show{0%{opacity:0;transform:translateY(6px)}6%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
    @keyframes draw{0%{stroke-dashoffset:120}8%,78%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:120}}
    @keyframes pulse{0%,10%{stroke:#30363d}20%,70%{stroke:#f97316;stroke-width:3}85%,100%{stroke:#30363d}}
  </style>
  <rect class="bg" width="900" height="300" rx="14"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text class="term" x="28" y="66"><tspan class="prompt">$</tspan> zizkadb why evt_8842</text>

  <g class="node n1">
    <rect x="40" y="110" width="220" height="74" rx="10"/>
    <text class="t" x="60" y="140">tool_call</text>
    <text class="s" x="60" y="164">lookup_order · ORD-8842</text>
  </g>
  <path class="edge e1" d="M262 147 H 338"/>
  <g class="node n2">
    <rect x="340" y="110" width="220" height="74" rx="10"/>
    <text class="t" x="360" y="140">llm_response</text>
    <text class="s" x="360" y="164">gpt-4o</text>
  </g>
  <path class="edge e2" d="M562 147 H 638"/>
  <g class="node n3 root">
    <rect x="640" y="110" width="240" height="74" rx="10"/>
    <text class="t" x="660" y="140">user_message</text>
    <text class="s" x="660" y="164">Why was my order delayed?</text>
  </g>
  <text class="cap" x="760" y="222" text-anchor="middle">▲ root cause</text>
  <text class="term" x="28" y="272" style="font-size:13px">each step links to its parent_id · db.why() walks the chain back</text>
</svg>
